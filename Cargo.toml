[package]
name = "gitscale"
version = "0.3.1"
edition = "2021"
description = "Toolkit enabling development and releases across multiple git repositories."
license = "MIT"
repository = "https://github.com/thepartly/gitscale"

[[bin]]
name = "gitscale"
path = "src/main.rs"

[[bin]]
name = "git-scale"
path = "src/bin/git-scale.rs"

[lib]
name = "gitscale"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", features = ["now"] }
url = "2"
anyhow = "1"
regex = "1"
indicatif = "0.17"

[dev-dependencies]
insta = { version = "1", features = ["redactions", "json"] }
tempfile = "3"
