[package]
name = "gitscale"
version = "0.6.1"
edition = "2021"
description = "Toolkit enabling development and releases across multiple git repositories."
license = "MIT"
repository = "https://github.com/thepartly/gitscale"

[[bin]]
name = "gitscale"
path = "src/main.rs"

[[bin]]
name = "git-scale"
path = "src/bin/git-scale.rs"

[[bin]]
name = "git-topic"
path = "src/bin/git-topic.rs"

[[bin]]
name = "git-upgrade"
path = "src/bin/git-upgrade.rs"

[[bin]]
name = "git-explain"
path = "src/bin/git-explain.rs"

[lib]
name = "gitscale"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_mangen = "0.3"
console = "0.15"
libc = "0.2"
toml = "0.8"
toml_edit = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
hex = "0.4"
humantime = "2"
chrono = { version = "0.4", features = ["now"] }
base64 = "0.22"
globset = "0.4"
url = "2"
anyhow = "1"
regex = "1"
indicatif = "0.17"

[dev-dependencies]
insta = { version = "1", features = ["redactions", "json"] }
tempfile = "3"
