services:
  # The reference OCI registry, for the opt-in conformance tests:
  #
  #   docker compose up -d registry
  #   GITSCALE_TEST_REGISTRY=localhost:5000 cargo test --test it registry:: # on the host
  #   GITSCALE_TEST_REGISTRY=registry:5000 cargo test --test it registry::  # in the devbox
  #
  # It serves plain HTTP; the tests opt in to that with an http:// registry.
  registry:
    image: registry:2
    ports:
      - "5000:5000"
    networks:
      - default
      
      - devbox

networks:
  devbox:
    # Attach to the existing devcontainer network so the registry is reachable
    # from inside the dev container by service name ("registry").
    # Change the 'name' below to match your devcontainer network
    # (run `docker network ls` to find it).
    external: true
    name: ${DEVBOX_NETWORK:-devbox_andrey_default}
