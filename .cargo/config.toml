# Test isolation: keep the developer's machine out of the test suite.
#
# gitscale installs itself as a git hook, and a --system install writes
# core.hooksPath to /etc/gitconfig — outside $HOME, so the usual trick of
# isolating HOME does not hide it. On a machine that has one, the installed
# gitscale fires on any `git worktree add` or `git clone` of a fixture holding
# a .gitscale.toml and populates it before the test's own code runs. Nothing
# errors; the test just silently measures the released binary instead of this
# one. `gitscale hook status` also then reports a path its fixtures know
# nothing about.
#
# Cargo applies this to every process it launches, so `cargo run` sees it too:
# to exercise gitscale against this machine's real system config, run the built
# binary directly (`./target/debug/gitscale ...`) rather than through cargo.
[env]
GIT_CONFIG_NOSYSTEM = "1"

# The CI cache lives in the user's data directory, so without this every CI test
# — and every `gitscale cache` command a test runs — would populate the real
# ~/.local/share/gitscale. Pointed inside target/ instead, where it is as
# disposable as the rest of the build output. Tests that exercise the cache get
# a directory of their own on top of this (`TestEnv::run_with_env`).
GITSCALE_CACHE_DIR = { value = "target/gitscale-test-cache", relative = true }

# Registry logins: an artefact command that meets a 401 looks for what
# `docker login` or `podman login` stored, which on a developer's machine may
# run a credential helper (a keychain prompt, say) and would hand the tests
# whatever that user happens to be logged in to. Pointed at paths that do not
# exist; tests about stored logins set their own on the subprocess.
DOCKER_CONFIG = { value = "target/gitscale-test-docker", relative = true }
REGISTRY_AUTH_FILE = { value = "target/gitscale-test-docker/auth.json", relative = true }

# Run under a CI job, the suite would otherwise inherit the job's own markers,
# and every in-process test would switch to CI behaviour — shallow checkouts,
# snapshot entries, failing hooks, checkouts scrubbed after each pull — while
# asserting the developer-machine one. Cargo cannot unset a variable, but
# gitscale reads an empty one as unset, and `force` overrides the ambient value.
# Tests about CI set these on the subprocess they launch (`run_with_env`).
CI = { value = "", force = true }
GITLAB_CI = { value = "", force = true }
CI_JOB_TOKEN = { value = "", force = true }
GITHUB_ACTIONS = { value = "", force = true }

# The network: tests never reach a real host. Fixtures name hosts such as
# github.com or gitlab.invalid for the allowlist and the CI rewrites to judge,
# and a remote that cannot be reached is sometimes the point — but an attempt
# must fail here, at once, rather than wait on DNS or on a host that answers.
# HTTP(S) goes to a proxy on a port nothing listens on, except for the test
# servers on this machine and the conformance registry's compose service;
# ssh is a command that fails.
HTTP_PROXY = { value = "http://127.0.0.1:9", force = true }
HTTPS_PROXY = { value = "http://127.0.0.1:9", force = true }
http_proxy = { value = "http://127.0.0.1:9", force = true }
https_proxy = { value = "http://127.0.0.1:9", force = true }
NO_PROXY = { value = "127.0.0.1,localhost,::1,registry", force = true }
no_proxy = { value = "127.0.0.1,localhost,::1,registry", force = true }
GIT_SSH_COMMAND = { value = "false", force = true }
