<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" role="img" aria-label="Consumers pull the image tagged with the commit their revision resolves to" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">
  <style>
    .ink { fill: #1f2328; }
    .quiet { fill: #59636e; }
    .edge { stroke: #8c959f; }
    .head { fill: #8c959f; }
    .box { fill: none; stroke: #8c959f; stroke-width: 1.25; }
    .accent { fill: #0969da; fill-opacity: 0.12; stroke: #0969da; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #e6edf3; }
      .quiet { fill: #9198a1; }
      .edge { stroke: #656c76; }
      .head { fill: #656c76; }
      .box { stroke: #656c76; }
      .accent { fill: #4493f8; fill-opacity: 0.16; stroke: #4493f8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="head"/>
    </marker>
  </defs>

  <text x="24" y="34" font-size="15" font-weight="600" class="ink">Consumers pull the image tagged with the commit their revision resolves to</text>

  <g fill="none" stroke-width="1.25" class="edge">
    <path d="M236 110H274" marker-end="url(#arrow)"/>
    <path d="M486 110H524" marker-end="url(#arrow)"/>
    <path d="M274 250H130V138" marker-end="url(#arrow)"/>
    <path d="M486 250H630V138" marker-end="url(#arrow)"/>
  </g>

  <rect x="24" y="82" width="212" height="56" rx="8" class="box"/>
  <text x="130" y="106" text-anchor="middle" font-weight="600" class="ink">Producer repo</text>
  <text x="130" y="124" text-anchor="middle" font-size="11.5" class="quiet">branches and tags</text>

  <rect x="274" y="82" width="212" height="56" rx="8" class="box"/>
  <text x="380" y="106" text-anchor="middle" font-weight="600" class="ink">Publish job</text>
  <text x="380" y="124" text-anchor="middle" font-size="11.5" class="quiet">gitscale artefact publish</text>

  <rect x="524" y="82" width="212" height="56" rx="8" class="accent"/>
  <text x="630" y="106" text-anchor="middle" font-weight="600" class="ink">OCI registry</text>
  <text x="630" y="124" text-anchor="middle" font-size="11.5" class="ink">&lt;path&gt;/gitscale:&lt;commit&gt;</text>

  <rect x="274" y="222" width="212" height="56" rx="8" class="box"/>
  <text x="380" y="246" text-anchor="middle" font-weight="600" class="ink">Consumer workspace</text>
  <text x="380" y="264" text-anchor="middle" font-size="11.5" class="quiet">gitscale pull</text>

  <text x="255" y="70" text-anchor="middle" font-size="11.5" class="quiet">every push</text>
  <text x="505" y="70" text-anchor="middle" font-size="11.5" class="quiet">tag = commit SHA</text>

  <text font-size="11.5" class="quiet">
    <tspan x="140" y="176">1. ls-remote</tspan>
    <tspan x="140" y="192">revision → commit</tspan>
  </text>
  <text font-size="11.5" text-anchor="end" class="quiet">
    <tspan x="620" y="176">2. pull the image</tspan>
    <tspan x="620" y="192">tagged with that commit</tspan>
  </text>

  <text x="380" y="300" text-anchor="middle" font-size="11.5" class="quiet">no image for the commit → the command fails</text>
</svg>
